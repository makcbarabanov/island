<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Марафон — статистика</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f8fa; }
    body { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
    .card { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card .n { font-size: 1.75rem; font-weight: 700; }
    .card .l { font-size: 0.8rem; color: #666; margin-top: 0.25rem; }
    .err { color: #b00020; }
    a { color: #0b57d0; }
  </style>
</head>
<body>
  <h1>Марафон полезных привычек</h1>
  <p class="meta" id="meta">Загрузка…</p>
  <div class="cards" id="cards"></div>
  <p class="meta" style="margin-top:2rem"><a href="legacy/stat.html">Прототип по чату (legacy)</a></p>
  <script>
    (async function () {
      const meta = document.getElementById('meta');
      const cards = document.getElementById('cards');
      try {
        const r = await fetch('data/marathon_snapshot.json?_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        meta.textContent = 'Снимок: ' + (d.generated_at || '—') + ' · TZ ' + (d.timezone || 'Europe/Moscow');
        const items = [
          ['active', 'Активных сегодня'],
          ['reported', 'Сдали отчёт'],
          ['missing', 'Без отчёта'],
          ['report_rate_pct', 'Сдача, %']
        ];
        cards.innerHTML = items.map(function (pair) {
          const v = d.summary && d.summary[pair[0]] != null ? d.summary[pair[0]] : '—';
          return '<div class="card"><div class="n">' + v + '</div><div class="l">' + pair[1] + '</div></div>';
        }).join('');
      } catch (e) {
        meta.innerHTML = '<span class="err">Нет снимка. Запустите <code>scripts/build_marathon_snapshot.py</code>.</span>';
        cards.innerHTML = '';
      }
    })();
  </script>
</body>
</html>
