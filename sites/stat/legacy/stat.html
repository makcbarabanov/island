<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разметка чата марафона</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --border: #dde1e6;
      --text: #1a1a1a;
      --muted: #6b7280;
      --accent: #2563eb;
      --manifest: #7c3aed;
      --report: #059669;
      --simple: #6b7280;
      --warn: #fef08a;
      --out-window: #f9fafb;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      flex-shrink: 0;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 10;
    }
    h1 { margin: 0 0 8px; font-size: 1.15rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .toolbar input[type="search"] {
      min-width: 200px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    button, .btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      cursor: pointer;
      font-size: 13px;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button:hover { filter: brightness(0.97); }
    .stats {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    main {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 16px 24px;
    }
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      background: var(--card);
      width: max-content;
      min-width: 100%;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      vertical-align: top;
      text-align: left;
    }
    thead th {
      background: #eef2ff;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 1px 0 var(--border);
    }
    tr.out-window { background: var(--out-window); opacity: 0.65; }
    tr.mismatch td.opinion-col { background: var(--warn); }
    tr.labeled-match .opinion-badge { outline: 2px solid #22c55e; }
    .msg-col {
      width: 480px;
      max-width: 480px;
    }
    .msg-text {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.4;
    }
    .opinion-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
    }
    .opinion-badge.simple { background: var(--simple); }
    .opinion-badge.manifest { background: var(--manifest); }
    .opinion-badge.report { background: var(--report); }
    .cb-col {
      text-align: center;
      width: 2rem;
      padding: 8px 2px !important;
    }
    .cb-col input { width: 16px; height: 16px; cursor: pointer; margin: 0; }
    th.cb-col { font-size: 11px; line-height: 1.2; padding: 6px 2px !important; }
    .date-col { width: 5.5rem; line-height: 1.3; }
    .date-col .time-part { color: var(--muted); font-size: 12px; }
    .author-col { white-space: nowrap; width: 5.5rem; }
    .opinion-col { width: 5.5rem; white-space: nowrap; }
    .ruchka-col { background: #fffbeb; }
    th.ruchka-col { background: #fef3c7; font-size: 10px; }
    #import-input { display: none; }
    .hidden { display: none !important; }
    .filter-author { padding: 6px; border-radius: 6px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>Разметка чата марафона</h1>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Поиск по тексту, автору…">
      <select id="filter-author" class="filter-author">
        <option value="">Все авторы</option>
      </select>
      <select id="filter-type" class="filter-author">
        <option value="">Все типы (мнение)</option>
        <option value="simple">Мнение: простое</option>
        <option value="manifest">Мнение: манифест</option>
        <option value="report">Мнение: отчёт</option>
      </select>
      <label><input type="checkbox" id="only-unlabeled"> Только неразмеченные</label>
      <label><input type="checkbox" id="only-window" checked> Только июньский цикл (25.05–22.06)</label>
      <label><input type="checkbox" id="only-mismatch"> Только расхождения</label>
      <label><input type="checkbox" id="only-aigul-reports"> Только отчёты Айгуль</label>
      <button type="button" class="primary" id="btn-export">Скачать разметку (JSON)</button>
      <button type="button" class="primary" id="btn-export-ruchka">Скачать ручку (JSON)</button>
      <button type="button" id="btn-import">Импорт JSON</button>
      <input type="file" id="import-input" accept=".json,application/json">
      <button type="button" id="btn-clear">Сбросить разметку</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <div class="table-wrap">
    <table>
      <colgroup>
        <col class="date-col">
        <col class="author-col">
        <col class="msg-col">
        <col class="cb-col">
        <col class="cb-col">
        <col class="cb-col">
        <col class="ruchka-col">
        <col class="opinion-col">
      </colgroup>
      <thead>
        <tr>
          <th class="date-col">Дата</th>
          <th class="author-col">Автор</th>
          <th class="msg-col">Сообщение</th>
          <th class="cb-col">Простое</th>
          <th class="cb-col">Манифест</th>
          <th class="cb-col">Отчёт</th>
          <th class="cb-col ruchka-col">Ручка</th>
          <th class="opinion-col">Мнение</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </main>

земле снижают воспаление. Гаэтан Шевалье опубликовал механизм в 2012. Тело заряжается от планеты, как телефон от розетки ⚡️ \n\nКогда ты последний раз стоял босиком на земле? Не пробежал. А именно стоял минут 10.\n\nУ большинства взрослых ответ: «не помню». Лето, дача, в детстве.\n\nЭто аномалия. Первое поколение в истории, которое СПИТ В ИЗОЛЯЦИИ ОТ ПЛАНЕТЫ.\n\n‼️поверхность Земли НЕСЁТ ОТРИЦАТЕЛЬНЫЙ ЗАРЯД ‼️\nКогда босая кожа касается земли, электроны переходят в тело.\n\nИ начинают делать одну конкретную вещь.\n\nКаждая клетка ежедневно производит миллиарды СВОБОДНЫХ РАДИКАЛОВ. Побочный продукт работы митохондрий. Они повреждают ДНК, белки, мембраны.\n\nХроническое воспаление и большинство возрастных болезней начинаются с этого. ОКИСЛИТЕЛЬНЫЙ СТРЕСС.\n\nЭлектрон отрицателен. Свободный радикал положителен. Электрон отдаётся радикалу и нейтрализует его. Та же химия, что у витамина С. Не через еду. А через ПРЯМОЙ КОНТАКТ С ЗЕМЛЁЙ.\n\nНеисчерпаемый антиоксидант. Под ногами.\n\n🌡 Что зафиксировали тепловизоры\n\nШевалье и Ошман снимали участников инфракрасной камерой. Воспалённые зоны (колени, спина, плечи) светятся красным.\n\nПосле 30 минут заземления красные пятна ВИДИМО УМЕНЬШАЮТСЯ. Сдвиг видно глазом.\n\nЧерез несколько дней регулярного заземления участники сообщают о снижении боли и улучшении сна. Кортизол падает. Вариабельность сердечного ритма растёт.\n\nНо, наука пока спорит\n\nЧто НЕ оспаривается:\n→ Поверхность Земли реально заряжена отрицательно\n→ Свободные радикалы реально вызывают воспаление\n→ Электроны реально нейтрализуют радикалы\n→ Люди в исследованиях сообщают об улучшении сна и снижении боли\n\nСовременный человек впервые в истории живёт ОТРЕЗАННЫМ ОТ ЗАРЯДА ПЛАНЕТЫ.\nА потом удивляемся хроническому воспалению, плохому сну и фоновой усталости.\n\n🌿 Как заземляться правильно\n\n→ Босиком на ТРАВЕ, влажной земле, песке, камнях. 30 минут в день\n→ УТРОМ до завтрака работает лучше всего\n→ Вода в озере, реке, море тоже проводит электроны\n→ Зимой заземляющие коврики, подключённые к заземлению розетки\n\n🌳 Вспомните. Приехали на дачу, скинули кроссовки, прошлись босиком до бани или речки. К вечеру вам как-то иначе. Не «отдохнул». Тело просто соприкоснулось с зарядом планеты.\n\nВпереди окно возможностей - 92 дня лета-  не упустите. Утром по росе. Днём по тёплой земле. У воды босиком в реку.\n\n🔋 Главное\n\n30 минут босиком. Бесплатно. Без врачей. Просто верни себе то, что у тебя забрали резиновые подошвы.", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 40, "datetime": "01.06.2026 23:45", "date": "01.06.2026", "year": 2026, "month": 6, "day": 1, "authorRaw": "Макс Барабанов", "author": "Макс", "text": "Отчёт 1.06\n\n🙂 Спортзал \n🙂 Заработал 9000 руб за смену \n🙂 Учил английский, как всегда с ИИ за рулём\n🙂 Слушаю книгу про создателя чата жпт Сэма Альтмана\n🙂 Сделал 2 энергопрактики\n🙂 Вода 2 литра ) пью только на марафонах )\n\n🥲 Учёба (устал на работе, и поздно закончил)\n🥲 Дыхание ВимоХофу , уже пора спать ложиться ) не до него", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 41, "datetime": "01.06.2026 23:46", "date": "01.06.2026", "year": 2026, "month": 6, "day": 1, "authorRaw": "Макс Барабанов", "author": "Макс", "text": "а самое главное я впервые за долгое время выложил СТОРИС %)))) \nhttps://t.me/Makc_Barabanov/s/125", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 42, "datetime": "02.06.2026 05:33", "date": "02.06.2026", "year": 2026, "month": 6, "day": 2, "authorRaw": "София Завтрак Красноярск", "author": "София", "text": "↩ Макс Барабанов: Мои цели на марафон:\n1. Запустить соцсеть\n2. Освоить новую профессию вайбкоде...\nПопробую присоединиться.\n\nМои цели на 91 день.\n\n1. Закрыть кредитку, лучше две.\n2. Создать доход на x2… x3 в сравнении с доходом февраль-май\n2.  Вернуться в  йогу \n3.  Закончить 2 курс АСI.\n4. Слушать ручку на ежедневной основе! \n5. Кофе-медитация на ежедневной основе.\n6. Отдых выходного дня.\n7. Расхламить квартиру\n8 ёт мощная практика:\n\n«Пробуждение желаний»\nНа основе своих ценностей, критериев счастья и настоящих желаний вы создадите образ своей лучшей жизни и пропишете собственный сценарий будущего.\n🤝 Это мероприятие для тех, кто:\n• Хочет жить осознанно\n• Ищет внутреннюю опору\n• Устал от суеты без смысла\n• Хочет понять, куда двигаться дальше\n• Стремится к счастливой и успешной жизни\n\n📅 Дата: 7 июня\n📍 Место: One Way Loft, ул. Пушкина, 22г\n⏰ Время: 10:00–15:00\n\n👗 ДРЕСС-КОД:\nПоддержите атмосферу мероприятия и выберите образ в белом, голубом  или зеленом цвете.\n✨ Элегантный деловой или праздничный стиль будет идеальным выбором.\n🎟 Стоимость участия:\n\n💰 500₽ — первая часть \n🚨 Количество мест ограничено!\nНе упустите возможность провести день в окружении сильных и осознанных людей, получить новые инструменты для достижения целей и сделать шаг к жизни своей мечты.\n📲 Забронировать место:\nhttp://travel-krsk.ru/\nПриходите сами и приглашайте близких. Возможно, именно этот день станет началом нового этапа вашей жизни! 🚀", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 97, "datetime": "06.06.2026 08:23", "date": "06.06.2026", "year": 2026, "month": 6, "day": 6, "authorRaw": "Щербинина Света", "author": "Света", "text": "[фото]\nМой первый кофе ))", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 98, "datetime": "06.06.2026 08:23", "date": "06.06.2026", "year": 2026, "month": 6, "day": 6, "authorRaw": "Щербинина Света", "author": "Света", "text": "[фото]", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 99, "datetime": "06.06.2026 09:07", "date": "06.06.2026", "year": 2026, "month": 6, "day": 6, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "Как приятно смотреть и вдохновляться, спасибо🙏 💜😍", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 100, "datetime": "06.06.2026 09:08", "date": "06.06.2026", "year": 2026, "month": 6, "day": 6, "authorRaw": "Ксения Роговенко💎", "author": "Кс 06.06.2026", "year": 2026, "month": 6, "day": 6, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "[фото]\n❣️ С днём рождения, наше всё, наш Александр Сергеевич! ✍️ С днём русского языка!✏️\n\n\n💌Александр Сергеевич Пушкин\n«Моя эпитафия» \n\nЗдесь Пушкин погребен; он с музой молодою,\nС любовью, леностью провел веселый век.\nНе делал доброго, однако ж был душою,\nЕй-богу, добрый человек.\n\n1815\n\n(шуточная эпитафия, которую Пушкин написал самому себе в 16 лет)\n\n\n🤩🤩🤩🤩🤩🤩🤩🤩", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 109, "datetime": "06.06.2026 18:29", "date": "06.06.2026", "year": 2026, "month": 6, "day": 6, "authorRaw": "Гузеля ☀️✨ Казань", "author": "Гузеля", "text": "[файл]\n🎥Сегодня в рубрике #кинотеатр_ру предлагаем посмотреть Фильм «История семьи Блум» 2020г. 12+.\n\n История о том, как раненый птенец сороки и любовь семьи помогли парализованной женщине заново научиться летать.\n\nЖизнь активной сёрфингистки и матери троих сыновей Сэм Блум полностью меняется за секунду — во время отпуска в Таиланде она падает с балкона из-за сломанных перил и получает тяжелую травму позвоночника, оставшись почти полностью парализованной. В попытках справиться с болью и депрессией она замкнулась в себе, но возвращение домой приносит неожиданную встречу — старший сын находит раненого птенца сороки. Назвав его Пингвином, семья принимает птицу, как полноценного члена семьи. Наблюдая за тем, как Пингвин, несмотря на сломанное крыло, учится заново летать, Сэм находит в себе силы начать исцеление и борьбу за возвращение к полноценной жизни. \n\n  Фильм «История семьи Блум» учит находить свет в самых тёмных обстоятельствах и верить, что жизнь можно перестроить заново, даже когда кажется, что она разрушена навсегда. Картина напоминает, что поддержка близких — это наша опора, а любовь и терпение помогают пережить самые тяжелые времена. \n\n Фильм основан на реальных событиях, а настоящая Сэм Блум вместе со своей семьей лично участвовала в создан  и будете готовы встретить достойного мужчину\nБонусы для участниц:\n🎁 Практика «Переход в счастливую реальность»\n💚  Розыгрыш консультации с разбором личной ситуации\n\nЕсли откликается, пришлите мне в ответ ➕ и я открою доступ в чат", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 140, "datetime": "08.06.2026 13:34", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "У меня подарок: поддержка 🙏❤", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 141, "datetime": "08.06.2026 14:17", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Макс Барабанов", "author": "Макс", "text": "Круто, когда начинаешь?", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 142, "datetime": "08.06.2026 15:18", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "↩ Макс Барабанов: Круто, когда начинаешь?\n15 июня😍", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 143, "datetime": "08.06.2026 15:19", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "[фото]\nМой поток энергии 🤩", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 144, "datetime": "08.06.2026 19:47", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Спарта Куба", "author": "Спарта", "text": "Переходы получилось сделать около 10 раз", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 145, "datetime": "08.06.2026 19:48", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Спарта Куба", "author": "Спарта", "text": "Благодарю @writer_ksenia за поддержку", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 146, "datetime": "08.06.2026 19:52", "date": "08.06.2026", "year": 2026, "month": 6, "day": 8, "authorRaw": "Спарта Куба", "author": "Спарта", "te \n\nПошла ...\nНу ждём", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 234, "datetime": "13.06.2026 10:14", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "☀️Доброе утро, дорогие!\n\nУточнение РАСПИСАНИЯ ПРАКТИКУМА \"ВКУС ЖИЗНИ\" (коротко).\nКак обрести уверенность или как мечты обретают реальность.\n\n🔹 15 июня. Практика Пробуждение.\nМы посмотрим в то, чего мы не замечали, что было препятствием к мечте и новой жизни.\n\n🔹16 июня. Практика Новое начало.\nТы честно ответишь на главные 3 вопроса и поймешь, какое решение тебе нужно в твой ситуации, чтобы продвинуться вперед. Да уже так быстро)))\n\n🔹17 июня. Практика Наполнения. \nПеред новым началом, происходит очищение, а потом насыщение, потому что из «пустого стакана» ничего не может излиться.\nНаполнимся, чтобы внутри зажегся огонь, что даст движение мечте.\n\n🔹18 июня. Новые мечты.\nТы увидишь свои истинные мечты и отсечешь те, чтобы были ложные, поэтому ничего не менялось, откроется путь!\n\n🔹19 июня. Поймете мечта не из боли рождается, а из наслаждения, будем выходить в это состояние, прикасаться к нему🥰\n\n🔹 20 июня в субботу в 11-00 мск мы подведем итоги на живом он-лайн вебинаре!!!\n\nБудем вместе рассматривать карту твоего движения на намеченном пути к мечте, некоторые желания уже начнут осуществляться в процессе))\n\nКаждый день в 9 утра я выкладываю новые практики. Делаем в удобное время в течение дня. И в тот же день пишите свои осознания, я даю обратную связь. \n\n❗️Рекомендую не пропускать задания, один день плавно вытекает из другого. И важно проживать каждый день эти осознания, без спешки❤️ выделяя минимум 20 минут в день для себя любимой! кроме того, это практикум с психологом. Вы получите мою поддержку, как специалиста, в процессе, а значит быстрое продвижение к желаемому!\n\nП.с. наш практикум проходит и в телеграмм и в Максе, но у нас общее пространство и общий 💬 чат🙏 спасибо за ту атмосферу, что вы тоже привносите сюда взаимоподдержки, любви и доверия, мы можем здесь быть открыты, и максимальная честность с собой в первую очередь даст вам мощный сдвиг к своему пути мечты!", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 235, "datetime": "13.06.2026 10:15", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "Ура! Обучение 😍", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 236, "datetime": "13.06.2026 10:16", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "Отчет за 12.06:\n1. 6000 шагов", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 237, "datetime": "13.06.2026 19:00", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Щербинина Света", "author": "Света", "text": "Отчёт за 13.06.2026\n\n✅ — Слушать Ручку (3/11)\n✅ — Чтение книги (3/11)\n❌ — Сурья намаскар (3/11) (не выполнено)\n✅ — Отложить рубль на пространство (3/11)\n\n\n\nСо звездочкой:'\n\n1. Попить кофе с 5 новыми людьми. - состоялась первая встреча +1 +1\n2. 10000 шагов ( прошла 5588 ш)", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 238, "datetime": "13.06.2026 19:43", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Айгуль", "author": "Айгуль", "text": "Отчёт 13.06.2026\n\n1. Сурья Намаскар - 1 круг\n2. Питьевой режим - сделала\n3. \"Ручку\" - слушала\n4. Семена щедрости - посеяла", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 239, "datetime": "13.06.2026 19:51", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Спарта Куба", "author": "Спарта", "text": "Минута планка \nМинута на прямых\n8 переходов с прямых в планку", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 240, "datetime": "13.06.2026 19:52", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Макс Ба о.😍", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 254, "datetime": "13.06.2026 22:06", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "Мои успехи за 13.06:\n🌟7300 шагов\n🌟Благодарности\n🌟 Писала книгу🤓", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 255, "datetime": "13.06.2026 23:30", "date": "13.06.2026", "year": 2026, "month": 6, "day": 13, "authorRaw": "Макс Барабанов", "author": "Макс", "text": "↩ Спарта Куба: Минута планка \nМинута на прямых\n8 переходов с прямых в планку\nСледующий раз что делаем?", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 256, "datetime": "14.06.2026 07:30", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "Макс Барабанов", "author": "Макс", "text": "Доброго всем утра, созвон сегодня в силе в 11:00 по Москве", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 257, "datetime": "14.06.2026 09:00", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "София Завтрак Красноярск", "author": "София", "text": "Отчёт 12_13_06_София\n1.  Распределила платежи.\n2.  Отменила мероприятие из за ,ЧП\n3.  Сурья\n4.  Ручку  слушала\n5.  МНК. Радость в моменте.\n6. -\n7.  -\n8.  -", "isSystem": false, "opinion": "report", "inWindow": true}, {"id": 258, "datetime": "14.06.2026 09:00", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "София Завтрак Красноярск", "author": "София", "text": "↩ Макс Барабанов: Доброго всем утра, созвон сегодня в силе в 11:00 по Москве\nПланирую быть", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 259, "datetime": "14.06.2026 10:39", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "Я немного опоздаю. Начинайте без меня.", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 260, "datetime": "14.06.2026 11:00", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "Макс Барабанов", "author": "Макс", "text": "https://us05web.zoom.us/j/83755661970?pwd=b48YmS13cmg2NFoBwNmPbvQjJPT31Q.1", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 261, "datetime": "14.06.2026 11:01", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "Айгуль", "author": "Айгуль", "text": "Привет. У меня сегодня не получится быть", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 262, "datetime": "14.06.2026 11:31", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "София Завтрак Красноярск", "author": "София", "text": "[фото]\nМИЛИЦЕЙСКИЙ ПРОТОКОЛ\nПроизошла со мной, а ещё точнее даже  с моей семьей вчера одна история. У каждого случается свой Сюр, я так думаю,  а  я хочу поделиться так сказать с обществом своим.  \nВчера мой младший ребенок, сын Миша девяти лет, как обычно убежал на прогулку в родной двор. Играл себе с друзьями на детской площадке и играл, никого не трогал. Как у него на глазах и всей честной компании \"увели\" самокат припаркованный в 20 метрах от качели. \nМиша в слезах, разумеется прибежал домой .  Хорошо мы с большим ребенком Ингой Авраменко @FreinAstra были дома.  Я тут же предложила пойдемте поищем хулиганов вместе, тем более куча свидетелей имеется. Авось догоним хулиганов!🤣 Никого конечно мы не догнали, но по пути обнаружили ещё пару свидетелей, притом взрослых (рабочего, косившего школьный двор и бдительную тётеньку),  заметивших самокатчиков на Мишином средстве передвижения.  Хочу сказать, что по пути нам попадалось множество людей, сочуствующих, мимо проходящих и желающих нам помочь. Инга умудрилась уговорить пару велосепедистов, безучастно скучающих на крыльце супермаркета объехать окрестности ближайших домов и помочь в поисках.  Велосипедисты оживились, хоть и ничего не обнаружили,  а мы в свою очередь позвонили  @Kandradt и уже на автомобиле  направились в близлежайший пункт полиции.  В полиции маленького пострадавшего опросили, после чего мы ещё до дома не добрались, а представители  полицейского участка уже опрашивали жителей и прохожих на месте происшествия, то есть в нашем дворе. \nВ результате  самокат был найден втечение минут сорока после оформления протокола. Хулиганов правда не нашли, да и ладно.  Главное маленький пострадавший был доволен как слон, ведь нашли его средство передвижения, да ещё и полицейские. 😆♥️\nВот такая вот игра в сыщиков с поисками, погонями у нас вчера вышла.\nЕсли честно, я в Happy end данной истории слабо верила, и согласилась с идеей Инги отправится в полицию лишь из соображений кармического менеджмента. Вроде как если никто не будет сообщать о кражах, то будет больше пострадавших и подобное.  \nА уж как я удивилась  тому что работники органов нашли таки самокат, да ещё и так быстро. ,🫪🔥\nИтогово хочу сказать, все же пишите заявление, чуть чего! Это работает. А НАША МИЛИЦИЯ (ПОЛИЦИЯ) НАС реально БЕРЕЖЕТ. Везде есть люди, которые выполняют свои обязательства качественно 💯. И это круто.\n\nP.S. Мне правда пришлось отменить сегодняшний нетворкинг с  Натальей Шоль @NataliaShol2, так как времени все наши расследования заняли очень много и мы не смогли собраться в лагерь с вечера, пришлось собираться с утра. Но в данной истории  это не главное. 🙌  \n\nСпасибо, что моих много бУкАв дочитали до конца 🔥\n\nВаша Я💃 (Фото к посту кстати сделано почти два года назад в Абхазии. Там по сей день Милиция😆).", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 263, "datetime": "14.06.2026 11:44", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "Спарта Куба", "author": "Спарта", "text": "https://us04web.zoom.us/j/73378685890?pwd=74M3mGDfvySHqXdiKMDNbBqsxaq9b0.1", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 264, "datetime": "14.06.2026 20:50", "date": "14.06.2026", "year": 2026, "month": 6, "day": 14, "authorRaw": "Щербинина Света", "author": "Света", "text": "Отчёт му написать книгу?\nОтредактировала. За  3 месяца работы оплата 1000 рублей", "isSystem": false, "opinion": "simple", "inWindow": true}, {"id": 356, "datetime": "22.06.2026 13:34", "date": "22.06.2026", "year": 2026, "month": 6, "day": 22, "authorRaw": "Ксения Роговенко💎", "author": "Ксения", "text": "Почти бесплатно", "isSystem": false, "opinion": "simple", "inWindow": true}];
    const STORAGE_KEY = 'marathon-labels-v1';
    const RUCHKA_STORAGE_KEY = 'marathon-ruchka-v1';
    const TYPE_LABELS = { simple: 'простое', manifest: 'манифест', report: 'отчёт' };

    let labels = loadLabels();
    let ruchkaLabels = loadRuchkaLabels();

    function loadRuchkaLabels() {
      try {
        const raw = localStorage.getItem(RUCHKA_STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function saveRuchkaLabels() {
      localStorage.setItem(RUCHKA_STORAGE_KEY, JSON.stringify(ruchkaLabels));
      updateStats();
    }

    function getRuchka(id) {
      return !!ruchkaLabels[id];
    }

    function setRuchka(id, value) {
      if (value) {
        ruchkaLabels[id] = true;
      } else {
        delete ruchkaLabels[id];
      }
      saveRuchkaLabels();
    }

    function isAigulReport(msg) {
      if (msg.author !== 'Айгуль') return false;
      const manual = getLabel(msg.id);
      return manual === 'report' || msg.opinion === 'report';
    }

    function ruchkaCell(msg) {
      if (!isAigulReport(msg)) {
        return '<td class="cb-col ruchka-col"></td>';
      }
      const checked = getRuchka(msg.id) ? 'checked' : '';
      return `<td class="cb-col ruchka-col"><input type="checkbox" data-ruchka="${msg.id}" title="Ручка выполнена в этом отчёте" ${checked}></td>`;
    }

    function loadLabels() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function saveLabels() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(labels));
      updateStats();
    }

    function getLabel(id) {
      return labels[id] ?? null;
    }

    function setLabel(id, type) {
      if (type === null) {
        delete labels[id];
      } else {
        labels[id] = type;
      }
      saveLabels();
      render();
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function matchesFilters(msg) {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const author = document.getElementById('filter-author').value;
      const typeFilter = document.getElementById('filter-type').value;
      const onlyUnlabeled = document.getElementById('only-unlabeled').checked;
      const onlyWindow = document.getElementById('only-window').checked;
      const onlyMismatch = document.getElementById('only-mismatch').checked;
      const onlyAigulReports = document.getElementById('only-aigul-reports').checked;

      if (onlyWindow && !msg.inWindow) return false;
      if (onlyAigulReports && !isAigulReport(msg)) return false;
      if (author && msg.author !== author) return false;
      if (typeFilter && msg.opinion !== typeFilter) return false;
      if (onlyUnlabeled && getLabel(msg.id)) return false;
      const manual = getLabel(msg.id);
      if (onlyMismatch && (!manual || manual === msg.opinion)) return false;
      if (q) {
        const hay = `${msg.datetime} ${msg.author} ${msg.text}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    function render() {
      const tbody = document.getElementById('tbody');
      const frag = document.createDocumentFragment();

      for (const msg of MESSAGES) {
        if (!matchesFilters(msg)) continue;
        const manual = getLabel(msg.id);
        const tr = document.createElement('tr');
        if (!msg.inWindow) tr.classList.add('out-window');
        if (manual && manual !== msg.opinion) tr.classList.add('mismatch');
        if (manual && manual === msg.opinion) tr.classList.add('labeled-match');

        const [datePart, timePart] = msg.datetime.split(' ');
        tr.innerHTML = `
          <td class="date-col">
            <div>${escapeHtml(datePart)}</div>
            <div class="time-part">${escapeHtml(timePart)}</div>
          </td>
          <td class="author-col" title="${escapeHtml(msg.authorRaw)}">${escapeHtml(msg.author)}</td>
          <td class="msg-col"><div class="msg-text">${escapeHtml(msg.text)}</div></td>
          <td class="cb-col"><input type="checkbox" data-id="${msg.id}" data-type="simple" ${manual === 'simple' ? 'checked' : ''}></td>
          <td class="cb-col"><input type="checkbox" data-id="${msg.id}" data-type="manifest" ${manual === 'manifest' ? 'checked' : ''}></td>
          <td class="cb-col"><input type="checkbox" data-id="${msg.id}" data-type="report" ${manual === 'report' ? 'checked' : ''}></td>
          ${ruchkaCell(msg)}
          <td class="opinion-col"><span class="opinion-badge ${msg.opinion}">${TYPE_LABELS[msg.opinion]}</span></td>
        `;
        frag.appendChild(tr);
      }
      tbody.replaceChildren(frag);
      updateStats();
    }

    function updateStats() {
      const total = MESSAGES.length;
      const labeled = Object.keys(labels).length;
      const inWindow = MESSAGES.filter((m) => m.inWindow);
      const labeledInWindow = inWindow.filter((m) => labels[m.id]).length;
      const mismatches = MESSAGES.filter((m) => labels[m.id] && labels[m.id] !== m.opinion).length;
      const aigulReports = MESSAGES.filter(isAigulReport);
      const ruchkaMarked = aigulReports.filter((m) => getRuchka(m.id)).length;
      document.getElementById('stats').textContent =
        `Всего: ${total} · Размечено: ${labeled} · В цикле: ${inWindow.length} (размечено ${labeledInWindow}) · Расхождений: ${mismatches} · Ручка (Айгуль): ${ruchkaMarked}/${aigulReports.length}`;
    }

    function exportJson() {
      const data = {
        exportedAt: new Date().toISOString(),
        cycleWindow: '2026-05-25 — 2026-06-22',
        messages: MESSAGES.map((m) => ({
          id: m.id,
          datetime: m.datetime,
          author: m.author,
          authorRaw: m.authorRaw,
          text: m.text,
          opinion: m.opinion,
          label: labels[m.id] ?? null,
          ruchka: isAigulReport(m) ? getRuchka(m.id) : null,
          inWindow: m.inWindow,
        })),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'marathon-labels.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function exportRuchkaJson() {
      const items = MESSAGES.filter(isAigulReport).map((m) => ({
        id: m.id,
        datetime: m.datetime,
        author: m.author,
        text: m.text,
        ruchka: getRuchka(m.id),
      }));
      const data = {
        exportedAt: new Date().toISOString(),
        purpose: 'проверка привычки Ручка — отчёты Айгуль',
        messages: items,
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'marathon-ruchka-labels.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const items = data.messages ?? data;
          if (!Array.isArray(items)) throw new Error('Нет массива messages');
          const next = {};
          const nextRuchka = { ...ruchkaLabels };
          for (const item of items) {
            if (item.id != null && item.label) next[item.id] = item.label;
            if (item.id != null && item.ruchka === true) nextRuchka[item.id] = true;
            if (item.id != null && item.ruchka === false) delete nextRuchka[item.id];
          }
          labels = next;
          ruchkaLabels = nextRuchka;
          saveLabels();
          saveRuchkaLabels();
          render();
          alert(`Импортировано меток: ${Object.keys(labels).length}`);
        } catch (e) {
          alert('Ошибка импорта: ' + e.message);
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('tbody').addEventListener('change', (e) => {
      const cb = e.target;
      if (cb.type !== 'checkbox') return;
      if (cb.dataset.ruchka) {
        setRuchka(+cb.dataset.ruchka, cb.checked);
        return;
      }
      if (!cb.dataset.id) return;
      const id = +cb.dataset.id;
      const type = cb.dataset.type;
      if (cb.checked) {
        setLabel(id, type);
      } else if (getLabel(id) === type) {
        setLabel(id, null);
      }
    });

    ['search', 'filter-author', 'filter-type'].forEach((id) => {
      document.getElementById(id).addEventListener('input', render);
      document.getElementById(id).addEventListener('change', render);
    });
    ['only-unlabeled', 'only-window', 'only-mismatch', 'only-aigul-reports'].forEach((id) => {
      document.getElementById(id).addEventListener('change', render);
    });

    document.getElementById('btn-export').addEventListener('click', exportJson);
    document.getElementById('btn-export-ruchka').addEventListener('click', exportRuchkaJson);
    document.getElementById('btn-import').addEventListener('click', () => {
      document.getElementById('import-input').click();
    });
    document.getElementById('import-input').addEventListener('change', (e) => {
      if (e.target.files[0]) importJson(e.target.files[0]);
      e.target.value = '';
    });
    document.getElementById('btn-clear').addEventListener('click', () => {
      if (confirm('Сбросить всю ручную разметку в localStorage?')) {
        labels = {};
        ruchkaLabels = {};
        saveLabels();
        saveRuchkaLabels();
        render();
      }
    });

    const authors = [...new Set(MESSAGES.map((m) => m.author))].sort();
    const sel = document.getElementById('filter-author');
    for (const a of authors) {
      const opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      sel.appendChild(opt);
    }

    render();
  </script>
</body>
